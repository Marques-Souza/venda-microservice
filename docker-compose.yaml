services:
  postgres-service:
    image: postgres:17-alpine
    container_name: postgres-service-venda
    ports:
      - "5444:5432"
    environment:
      POSTGRES_DB: cadastro_vendas_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

